{% load static %}
<nav class="navbar navbar-expand-lg bnb-navbar">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="/">
      <img src="{% static 'images/brand/bnb-logo.png' %}" alt="Bharat Nidhi Bank Logo" class="bnb-logo-img me-2">
    </a>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#bnbPublicNav" aria-controls="bnbPublicNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="bnbPublicNav">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-1">
        <li class="nav-item">
          <a class="nav-link bnb-nav-link" href="/personal/">Personal</a>
        </li>
        <li class="nav-item">
          <a class="nav-link bnb-nav-link" href="/business/">Business</a>
        </li>
        <li class="nav-item">
          <a class="nav-link bnb-nav-link" href="/nri/">NRI</a>
        </li>
        <li class="nav-item">
          <a class="nav-link bnb-nav-link" href="/rural/">Agricultural & Rural</a>
        </li>
        <li class="nav-item">
          <a class="nav-link bnb-nav-link" href="/loans-info/">Loans</a>
        </li>
        <li class="nav-item">
          <a class="nav-link bnb-nav-link" href="/digital-info/">Digital Banking</a>
        </li>
        <li class="nav-item">
          <a class="nav-link bnb-nav-link" href="/interest-rates/">Rates</a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-2">
        {% if user.is_authenticated %}
          <a href="/dashboard/" class="btn btn-bnb-accent d-flex align-items-center gap-2">
            <i class="bi bi-speedometer2"></i>
            <span>Dashboard</span>
          </a>
          <form method="post" action="/auth/logout/" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-secondary btn-sm" title="Log out">
              <i class="bi bi-box-arrow-right"></i>
            </button>
          </form>
        {% else %}
          <a href="/auth/login/" class="btn btn-bnb-primary d-flex align-items-center gap-2 px-3 py-2 shadow-sm">
            <i class="bi bi-lock-fill"></i>
            <span class="fw-bold">INTERNET BANKING</span>
          </a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
